<!DOCTYPE html>
<html>
<body>
    <h1 style="text-align: center;">Multiple DIV</h1> 
    <p id = "demo"></p>

    <div style="background-color: #FFF4A3; width: 600px; margin: auto;">
        <h2>London</h2>
        <p>London is the capital city of England.</p>
        <p>London has over 9 million inhabitants.</p>
    </div>

    <div style="background-color: rgb(209, 231, 250); width: 600px; margin: auto;">
        <h2>Light Switch</h2>
        <button onclick="document.getElementById('image').src='https://www.w3schools.com/js/pic_bulbon.gif'">Turn on</button>
        <img id="image" src="https://www.w3schools.com/js/pic_bulboff.gif" style="width:100px">
        <button onclick="document.getElementById('image').src='https://www.w3schools.com/js/pic_bulboff.gif'">Turn off</button>
    </div><br>

    <div style="background-color: rgb(117, 150, 178); width: 600px; margin: auto;"> 
        <h2>Change Text Color</h2>
        <p id="test" onclick="changeColor()">Click to change text color.</p>
        <!-- <button onclick="changeColor()">Change Color</button> -->
    </div>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;
}

.header {
  text-align: center;
  padding: 32px;
}

.container {
  display: flex;
  flex-wrap: wrap;
  padding: 0 4px;
}

/* 4 columns (Desktop) */
.column {
  flex: 25%;
  max-width: 25%;
  padding: 0 4px;
}

.column img {
  margin-top: 8px;
  width: 100%;
  vertical-align: middle;
}

/* 2 columns (Tablet) */
@media screen and (max-width: 800px) {
  .column {
    flex: 50%;
    max-width: 50%;
  }
}

/* 1 column (Mobile) */
@media screen and (max-width: 600px) {
  .column {
    flex: 100%;
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>Responsive Image Gallery</h1>
</div>

<div class="container">

  <div class="column">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
  </div>

  <div class="column">
    <img src="https://picsum.photos/300/200?4">
    <img src="https://picsum.photos/300/200?5">
    <img src="https://picsum.photos/300/200?6">
  </div>

  <div class="column">
    <img src="https://picsum.photos/300/200?7">
    <img src="https://picsum.photos/300/200?8">
    <img src="https://picsum.photos/300/200?9">
  </div>

  <div class="column">
    <img src="https://picsum.photos/300/200?10">
    <img src="https://picsum.photos/300/200?11">
    <img src="https://picsum.photos/300/200?12">
  </div>

</div>

</body>
</html>

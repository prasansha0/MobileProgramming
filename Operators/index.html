<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>

<body>
    <h2>Calculator</h2>

    <input type="number" placeholder="First Number" id="n1"> <br><br>
    <input type="number" placeholder="Second Number" id="n2"> <br><br>

    <button onclick="calculate('add')">+</button>
    <button onclick="calculate('sub')">-</button>
    <button onclick="calculate('mul')">*</button>
    <button onclick="calculate('div')">/</button>

    <p id = "result"></p>

    <script src="script.js"></script>
</body>
</html>

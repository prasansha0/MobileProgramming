<!DOCTYPE html>
<html>
    <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>
    <script>
        $(document).ready(function() {
        $("button").click(function() {
            var div = $("div");
            div.animate({top:'500px', height: '200px', width: '200px', fontSize: '50', opacity: '0.5' },"slow",
                function(){
                    div.css("backgroundColor","lightblue");
            div.animate({left:'500px', height: '150px', width: '150px', fontSize: '30', opacity: '0.3' },"400",
                function(){
                div.css("backgroundColor", "Pink"); 
            div.animate({top:'0px', height: '150px', width: '150px', fontSize: '40', opacity: '0.8' },"slow",
                function (){
                div.css("backgroundColor", "lightgreen");
                }); 
              }); 
           }); 
        });
    }); 
    </script>
    </head>

    <body>
    <button>Animate</button>
    <div style="background-color:yellow; height:100px; width:100px; position:absolute;">HELLO</div>
    </body>
</html>

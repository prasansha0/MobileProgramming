<!DOCTYPE html>
<html>
    <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>
    <script>
    $(document).ready(function() {
      $("#hide").click(function() {
        $("p").hide();
      }); 
      $("#show").click(function() {
        $("p").show();
      }); 
    }); 
    </script>
    </head>
    

    <body style="background-color: rgb(248, 208, 214)")>
        <p>Use button to hide or show content</p>
        <button id="hide">Hide</button>
        <button id="show">Show</button>
    </body>
</html>
